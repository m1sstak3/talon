<!doctype html>
<!-- A Talon add-on: collect SOL or one token from every account of a folder into one address. It only PROPOSES the batch:
     the wallet shows the plan in its own window and the owner confirms it with the password. Guide: docs/ADDONS.md -->
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Сбор</title>
<script type="application/json" id="talon-addon">
{
  "id": "sweep",
  "name": "Сбор",
  "version": "1.1.0",
  "description": "Собирает SOL или токен со всех счетов папки на один адрес — вы подтверждаете в кошельке",
  "permissions": ["accounts", "balances", "transfer"],
  "hosts": []
}
</script>
<style>
  :root { color-scheme: dark; --ink: #eeebe5; --ink-2: #b9b4ab; --ink-3: #7d786f; --line: rgb(238 235 229 / .16); --ember: #ff5a2e; }
  body { margin: 0; background: transparent; color: var(--ink); font: 15px/22px system-ui, sans-serif; }
  h1 { font-size: 32px; font-weight: 400; margin: 8px 0 16px; letter-spacing: -.02em; }
  label { display: grid; gap: 8px; margin: 16px 0; color: var(--ink-3); font-size: 13px; }
  select, input { min-height: 48px; padding: 0 16px; border: 0; border-radius: 12px; background: none; color: var(--ink); font: 15px system-ui; box-shadow: inset 0 0 0 1px var(--line); outline: none; }
  select option { background: #222227; }
  button { width: 100%; min-height: 48px; border: 0; border-radius: 999px; background: var(--ink); color: #07070a; font: 15px system-ui; cursor: pointer; }
  button:disabled { opacity: .4; cursor: default; }
  ul { list-style: none; margin: 16px 0; padding: 0; }
  li { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .mono { color: var(--ink-3); font: 12px ui-monospace, monospace; }
  .note { color: var(--ink-3); font-size: 13px; }
  .err { color: var(--ember); }
</style>
</head>
<body>
<h1>Сбор с папки</h1>
<label>Папка<select id="folder"></select></label>
<label>Что собрать<select id="asset"></select></label>
<ul id="list"></ul>
<label>Куда собрать (адрес Solana)<input id="to" spellcheck="false" autocomplete="off" placeholder="Адрес"></label>
<button id="go" disabled>Предложить перевод</button>
<p id="msg" class="note">Кошелёк покажет все переводы и спросит пароль. Без вашего подтверждения ничего не уйдёт.</p>
<script>
  // ---- the bridge: copy as is
  const talon = (() => {
    let n = 0; const wait = new Map()
    addEventListener('message', e => {
      const m = e.data
      if (e.source !== parent || !m || m.talon !== 1) return
      if (m.event) return dispatchEvent(new Event('talon:' + m.event))
      const w = wait.get(m.id); if (!w) return
      wait.delete(m.id); m.error ? w.no(new Error(m.error)) : w.ok(m.result)
    })
    return (method, params = {}) => new Promise((ok, no) => { const id = ++n; wait.set(id, { ok, no }); parent.postMessage({ talon: 1, id, method, params }, '*') })
  })()

  // ---- the add-on
  const $ = id => document.getElementById(id)
  let folders = [], rows = []
  // what an account holds of the chosen asset: SOL, or a token the wallet knows by name (an unnamed airdrop is never offered)
  const held = r => !$('asset').value ? r.sol : (r.tokens.find(t => t.mint === $('asset').value)?.amount ?? 0)
  const say = (t, bad = false) => { $('msg').textContent = t; $('msg').className = bad ? 'note err' : 'note' }
  async function load() {
    try {
      folders = await talon('folders')                                           // [{ name, accounts: [{ name, solana }] }]
      $('folder').replaceChildren(...folders.map((f, i) => Object.assign(document.createElement('option'), { value: i, textContent: `${f.name} (${f.accounts.length})` })))
      if (!folders.length) say('Папок нет: создайте папку в кошельке (меню счетов → + → Новая папка).', true)
      await show()
    } catch (e) { say(e.message, true) }
  }
  async function show() {
    const f = folders[$('folder').value]
    if (!f) return
    rows = (await talon('balances', { addresses: f.accounts.map(a => a.solana) })).rows // the wallet's own Solana node
    const was = $('asset').value
    const named = new Map(rows.flatMap(r => r.tokens).filter(t => t.symbol && t.amount > 0).map(t => [t.mint, t.symbol]))
    $('asset').replaceChildren(Object.assign(document.createElement('option'), { value: '', textContent: 'SOL' }),
      ...[...named].map(([mint, sym]) => Object.assign(document.createElement('option'), { value: mint, textContent: sym })))
    $('asset').value = named.has(was) ? was : ''
    list()
  }
  function list() {
    const f = folders[$('folder').value], sym = $('asset').selectedOptions[0]?.textContent ?? 'SOL'
    $('list').replaceChildren(...f.accounts.map((a, i) => {
      const li = document.createElement('li')
      li.innerHTML = '<span></span><span class="mono"></span>'
      li.firstChild.textContent = a.name
      li.lastChild.textContent = rows[i].sol === null ? '—' : held(rows[i]).toLocaleString('ru-RU', { maximumFractionDigits: 4 }) + ' ' + sym
      return li
    }))
    check()
  }
  const check = () => { $('go').disabled = !$('to').value.trim() || !rows.some(r => held(r) > 0) }
  $('folder').onchange = show
  $('asset').onchange = list
  $('to').oninput = check
  $('go').onclick = async () => {
    const f = folders[$('folder').value], to = $('to').value.trim()
    // empty accounts would fail a «max» transfer: only those holding the asset (and SOL for the fee) go into the proposal
    const sources = f.accounts.filter((a, i) => held(rows[i]) > 0 && rows[i].sol > 0 && a.solana !== to).map(a => ({ address: a.solana, amount: 'max' }))
    $('go').disabled = true; say('Ждём подтверждения в окне кошелька…')
    try { const r = await talon('requestTransfer', { to, sources, ...($('asset').value ? { token: $('asset').value } : {}) }); say(r.confirmed ? 'Подтверждено: переводы ушли в сеть.' : 'Отклонено: ничего не отправлено.') }
    catch (e) { say(e.message, true) }
    finally { check(); show() }
  }
  load()
  addEventListener('talon:accounts', load)
</script>
</body>
</html>
